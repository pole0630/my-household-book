<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리집 가계부</title><style>body{font-family:system-ui,'Malgun Gothic',sans-serif;background:#f4f6f8;color:#172c3a;margin:0}main{max-width:720px;margin:auto;padding:18px}h1{font-size:23px}.card{background:white;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 2px 9px #1020300a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hero{background:#173a50;color:white}small{color:#64748b}.hero small{color:#d1e1e9}.amount{font-size:25px;font-weight:750;margin:7px 0}label{display:block;font-size:13px;margin:10px 0 4px}input,select,button{font:inherit;box-sizing:border-box;width:100%;padding:11px;border:1px solid #d8e0e7;border-radius:9px;background:white}button{background:#173a50;color:white;border:0;font-weight:650;cursor:pointer;margin-top:12px}.secondary{background:#e7eef3;color:#173a50}nav{display:flex;gap:6px}nav button{font-size:13px}.hidden{display:none}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:9px 4px;border-bottom:1px solid #edf0f3;text-align:left}td:last-child,th:last-child{text-align:right}.muted{color:#64748b;font-size:12px}.negative{color:#b42318}.progress{height:7px;border-radius:9px;background:#e2e8f0;overflow:hidden}.bar{height:100%;background:#3c86a9} .actions{display:flex;gap:7px}.actions button{font-size:12px}.note{font-size:12px;color:#64748b;line-height:1.6}</style><link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#173a50"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png"></head><body><main><h1>우리집 가계부</h1><nav><button onclick="tab('home')">홈</button><button onclick="tab('entry')">입력</button><button onclick="tab('records')">내역</button><button onclick="tab('settings')">설정·백업</button></nav><section id="home"><div class="card hero"><small id="monthTitle"></small><div>이번 달 실제 소비</div><div class="amount" id="consumption"></div><small id="income"></small></div><div class="grid"><div class="card"><small>예비비 잔액</small><div class="amount" id="reserve"></div></div><div class="card"><b>생활비</b><p class="muted" id="budget"></p><div class="amount" id="remaining"></div><div class="progress"><div class="bar" id="budgetBar"></div></div><small id="spent"></small></div></div><div class="card"><b>이번 달 예비비 사용</b><div class="amount" id="reserveSpent"></div><div id="breakdown"></div></div></section><section id="entry" class="hidden"><div class="card"><h3>거래 입력</h3><label>날짜</label><input id="date" type="date"><label>거래 유형</label><select id="type" onchange="updateFields()"><option value="expense">지출</option><option value="income">수입</option><option value="transfer">계좌이체</option></select><label id="accountLabel">출금 통장</label><select id="account"><option value="living">생활비</option><option value="reserve">예비비</option><option value="other">기타</option></select><div id="destinationWrap" class="hidden"><label>입금 통장</label><select id="destination"><option value="reserve">예비비</option><option value="living">생활비</option><option value="other">기타</option></select></div><label>분류</label><select id="category"></select><label>내역</label><input id="memo" placeholder="예: 마트 장보기"><label>금액(원)</label><input id="amount" type="number" min="1" inputmode="numeric" placeholder="35000"><button onclick="addRecord()">저장</button></div></section><section id="records" class="hidden"><div class="card"><h3>거래 내역</h3><label>조회 월</label><input id="filterMonth" type="month" onchange="render()"><div style="overflow-x:auto"><table><thead><tr><th>날짜</th><th>분류·내역</th><th>금액</th><th></th></tr></thead><tbody id="recordRows"></tbody></table></div></div></section><section id="settings" class="hidden"><div class="card"><h3>예산·기초잔액</h3><label>매월 생활비 예산(원)</label><input id="monthlyBudget" type="number"><label>예비비 기초잔액(원)</label><input id="openingReserve" type="number"><label>기초잔액 기준일</label><input id="openingDate" type="date"><button onclick="saveSettings()">설정 저장</button><p class="note">기초잔액은 기준일 시작 시점의 통장 잔액입니다. 기준일 이후의 예비비 입출금만 잔액에 반영됩니다.</p></div><div class="card"><h3>백업</h3><button onclick="exportCSV()">거래 내역 CSV 다운로드</button><button class="secondary" onclick="exportJSON()">전체 데이터 JSON 백업</button><label>JSON 백업 복원</label><input type="file" accept=".json,application/json" onchange="importJSON(event)"><p class="note">체험판 데이터는 이 브라우저의 로컬 저장소에만 보관됩니다. 다른 기기와 자동 동기화되지 않으므로 반드시 백업하세요. 금융기관 연결은 없습니다.</p></div></section></main><script>
const categories=['식비','생필품','교통','통신','공과금','가족지원','자동차','건강·의료','경조사·선물','쇼핑·생활용품','여가·자기관리','반려동물','주택·인테리어','기타'];const reserveCats=categories.slice(5);const key='family-ledger-v1';const today=new Date();const iso=new Date(today.getTime()-today.getTimezoneOffset()*60000).toISOString().slice(0,10);let data;try{data=JSON.parse(localStorage.getItem(key))}catch{}data=data||{budget:1000000,openingReserve:0,openingDate:iso,records:[]};const $=id=>document.getElementById(id);const won=n=>Math.round(n).toLocaleString('ko-KR')+'원';const save=()=>localStorage.setItem(key,JSON.stringify(data));function tab(id){for(const s of ['home','entry','records','settings'])$(s).classList.toggle('hidden',s!==id);render()}function updateFields(){const type=$('type').value;$('destinationWrap').classList.toggle('hidden',type!=='transfer');$('accountLabel').textContent=type==='income'?'입금 통장':'출금 통장';$('category').disabled=type==='transfer';$('category').innerHTML=(type==='income'?['급여','기타수입']:categories).map(x=>`<option>${x}</option>`).join('')}function addRecord(){const amount=Number($('amount').value),type=$('type').value,account=$('account').value,destination=$('destination').value;if(!Number.isFinite(amount)||amount<=0||!$('date').value){alert('날짜와 올바른 금액을 입력하세요.');return}if(type==='transfer'&&account===destination){alert('출금 통장과 입금 통장을 다르게 선택하세요.');return}data.records.push({id:Date.now()+'-'+Math.random(),date:$('date').value,type,account,destination:type==='transfer'?destination:null,category:type==='transfer'?'계좌이체':$('category').value,memo:$('memo').value.trim(),amount});save();$('memo').value='';$('amount').value='';tab('home')}function del(id){if(confirm('이 거래를 삭제할까요?')){data.records=data.records.filter(r=>r.id!==id);save();render()}}function render(){const month=iso.slice(0,7),monthly=data.records.filter(r=>r.date.slice(0,7)===month);const sum=f=>monthly.filter(f).reduce((a,r)=>a+r.amount,0);const spent=sum(r=>r.type==='expense'&&r.account==='living');const consumption=sum(r=>r.type==='expense');const reserveSpent=sum(r=>r.type==='expense'&&r.account==='reserve');const inc=sum(r=>r.type==='income');const balance=data.records.filter(r=>r.date>=data.openingDate).reduce((a,r)=>a+(r.type==='income'&&r.account==='reserve'?r.amount:0)-(r.type==='expense'&&r.account==='reserve'?r.amount:0)+(r.type==='transfer'&&r.destination==='reserve'?r.amount:0)-(r.type==='transfer'&&r.account==='reserve'?r.amount:0),Number(data.openingReserve));$('monthTitle').textContent=month+' 월별 현황';$('consumption').textContent=won(consumption);$('income').textContent='이번 달 수입 '+won(inc);$('reserve').textContent=won(balance);$('budget').textContent='이번 달 예산 '+won(data.budget);$('remaining').textContent='잔액 '+won(data.budget-spent);$('spent').textContent=won(spent)+' 사용 ('+(data.budget?Math.round(spent/data.budget*100):0)+'%)';$('budgetBar').style.width=Math.min(100,data.budget?spent/data.budget*100:0)+'%';$('reserveSpent').textContent=won(reserveSpent);$('breakdown').innerHTML=reserveCats.map(c=>({c,n:sum(r=>r.type==='expense'&&r.account==='reserve'&&r.category===c)})).filter(x=>x.n).map(x=>`<p class="muted">${x.c}: ${won(x.n)}</p>`).join('')||'<p class="muted">사용 내역 없음</p>';$('monthlyBudget').value=data.budget;$('openingReserve').value=data.openingReserve;$('openingDate').value=data.openingDate;const fm=$('filterMonth').value||month;$('recordRows').innerHTML=data.records.filter(r=>r.date.slice(0,7)===fm).sort((a,b)=>b.date.localeCompare(a.date)).map(r=>`<tr><td>${r.date.slice(5)}</td><td>${r.category}<div class="muted">${escapeHTML(r.memo)} · ${r.account}${r.type==='transfer'?' → '+r.destination:''}</div></td><td>${r.type==='expense'?'-':r.type==='income'?'+':''}${won(r.amount)}</td><td><button class="secondary" style="padding:6px" onclick="del('${r.id}')">삭제</button></td></tr>`).join('')||'<tr><td colspan="4">기록 없음</td></tr>'}function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function saveSettings(){const b=Number($('monthlyBudget').value),o=Number($('openingReserve').value);if(!Number.isFinite(b)||b<0||!Number.isFinite(o)||!$('openingDate').value){alert('설정값을 확인하세요.');return}Object.assign(data,{budget:b,openingReserve:o,openingDate:$('openingDate').value});save();render();alert('저장했습니다.')}function download(content,name,type){const blob=new Blob(['\ufeff',content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}function exportCSV(){const header=['날짜','유형','출금/입금 통장','이체받는 통장','분류','내역','금액'];const rows=data.records.map(r=>[r.date,r.type,r.account,r.destination||'',r.category,r.memo,r.amount]);download([header,...rows].map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'가계부_거래내역.csv','text/csv;charset=utf-8')}function exportJSON(){download(JSON.stringify(data,null,2),'가계부_전체백업.json','application/json')}async function importJSON(e){const f=e.target.files[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(!Array.isArray(obj.records)||typeof obj.budget!=='number'||typeof obj.openingReserve!=='number'||typeof obj.openingDate!=='string')throw Error();if(confirm('현재 데이터를 백업 파일로 교체할까요?')){data=obj;save();render();alert('복원했습니다.')}}catch{alert('올바른 백업 파일이 아닙니다.')}e.target.value=''}$('date').value=iso;$('filterMonth').value=iso.slice(0,7);updateFields();render();
</script><script>if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}</script></body></html>
